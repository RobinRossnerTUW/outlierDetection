# PHASE 2 BASE CONFIG - copy and change marked lines only
# ======================================================
super_fancy_new_name: iam_c32_triplet_m03_s8_300k
log_dir: experiments
logger: wandb
grayscale: true

trainset:
  dataset: iam
  set: train
testset:
  dataset: iam
  set: test

model:
  name: resnet56
  num_clusters: 32

train_options:
  batch_size: 128
  epochs: 30
  loss: triplet
  margin: 0.3
  sampler_m: 8
  length_before_new_iter: 300000 #ADJUST

optimizer_options:
  base_lr: 0.0001
  final_lr: 0.000001
  warmup_epochs: 3
  wd: 0.0

pca_dims: [128]
test_batch_size: 256
train_label: writer
use_test_as_validation: true