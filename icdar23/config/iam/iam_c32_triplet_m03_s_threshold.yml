# ======================================================
# PHASE 2 BASE CONFIG - copy and change marked lines only
# ======================================================
super_fancy_new_name: iam_cluster_threshold
log_dir: experiments
logger: wandb
grayscale: true

trainset:
  dataset: iam_threshold
  set: train
testset:
  dataset: iam_threshold
  set: test

model:
  name: resnet56
  num_clusters: 32

train_options:
  batch_size: 128
  epochs: 30
  loss: triplet
  margin: 0.3
  sampler_m: 8
  length_before_new_iter: 236800 #ADJUST

optimizer_options:
  base_lr: 0.0001
  final_lr: 0.000001
  warmup_epochs: 3
  wd: 0.0

pca_dims: [128]
test_batch_size: 256
train_label: cluster
use_test_as_validation: true