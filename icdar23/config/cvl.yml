super_fancy_new_name: cvl_baseline
log_dir: experiments
logger: wandb

grayscale: false

trainset:
  dataset: cvl
  set: train

testset:
  dataset: cvl
  set: test

model:
  name: resnet56
  num_clusters: 32

train_options:
  batch_size: 128
  epochs: 30
  sampler_m: 8
  length_before_new_iter: 20000

optimizer_options:
  base_lr: 0.0001
  final_lr: 0.000001
  warmup_epochs: 3
  wd: 0.0

test_batch_size: 256
train_label: writer
use_test_as_validation: true